name: Tests and native MediaPipe smoke

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Run tests
        run: |
          python -B -m unittest discover -s tests -v

      - name: Native Face Mesh blank-image smoke check
        run: |
          python app.py check
